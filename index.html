<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="一个简洁、流畅、可部署的个人博客与日记应用。" />
    <title>风过留声 | Personal Blog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="site-header">
        <a class="brand" href="#" aria-label="返回首页">
          <span class="brand-mark"></span>
          <span>风过留声</span>
        </a>
        <nav class="top-nav" aria-label="主导航">
          <a href="#entries">日记</a>
          <a href="#compose" id="writeNavLink">写一篇</a>
          <button class="ghost-button" id="authButton" type="button">登录</button>
          <button class="ghost-button" id="themeToggle" type="button" aria-label="切换主题">
            <span class="sun-icon"></span>
          </button>
        </nav>
      </header>

      <main>
        <section class="hero-section" aria-labelledby="heroTitle">
          <div class="hero-copy">
            <p class="eyebrow">Personal Journal</p>
            <h1 id="heroTitle">把日常，写成一束安静的光。</h1>
            <p class="hero-subtitle">
              上传照片，记录心情，整理每一天闪过的片刻。访客可以阅读公开日记，管理员登录后可以写作与编辑。
            </p>
            <div class="hero-actions">
              <a class="primary-button" href="#compose" id="heroWriteLink">开始写日记</a>
              <button class="secondary-button" id="exportButton" type="button">导出备份</button>
              <label class="secondary-button file-import">
                导入备份
                <input id="importInput" type="file" accept="application/json" />
              </label>
            </div>
          </div>
          <div class="hero-visual" aria-label="博客照片墙">
            <div class="photo-card photo-card-large"></div>
            <div class="photo-card photo-card-small top"></div>
            <div class="photo-card photo-card-small bottom"></div>
          </div>
        </section>

        <section class="stats-strip" aria-label="博客统计">
          <article>
            <span id="entryCount">0</span>
            <p>篇日记</p>
          </article>
          <article>
            <span id="photoCount">0</span>
            <p>张照片</p>
          </article>
          <article>
            <span id="lastUpdated">今天</span>
            <p>最近更新</p>
          </article>
        </section>

        <section class="admin-status" id="adminStatus" hidden>
          <p class="eyebrow">Dashboard</p>
          <h2>写作后台</h2>
          <p id="cloudStatus">登录后才会显示编辑页面。</p>
        </section>

        <section class="compose-section" id="compose" aria-labelledby="composeTitle" hidden>
          <div class="section-heading">
            <p class="eyebrow">Compose</p>
            <h2 id="composeTitle">写一篇新的日记</h2>
          </div>

          <form class="editor" id="entryForm">
            <div class="form-grid">
              <label>
                标题
                <input id="titleInput" name="title" type="text" placeholder="今天想记住什么？" required />
              </label>
              <label>
                心情
                <select id="moodInput" name="mood">
                  <option value="平静">平静</option>
                  <option value="开心">开心</option>
                  <option value="思考">思考</option>
                  <option value="疲惫">疲惫</option>
                  <option value="感恩">感恩</option>
                </select>
              </label>
            </div>

            <label class="inline-check">
              <input id="publicInput" type="checkbox" checked />
              <span>公开显示在博客归档中</span>
            </label>

            <label>
              正文
              <textarea
                id="contentInput"
                name="content"
                rows="8"
                placeholder="写下今天发生的小事、想法或一段私人独白..."
                required
              ></textarea>
            </label>

            <div class="upload-panel">
              <label class="upload-box" for="imageInput">
                <input id="imageInput" type="file" accept="image/*" />
                <span class="upload-icon"></span>
                <strong>上传封面图片</strong>
                <small>支持 JPG、PNG、WebP。编辑日记时不重新选择图片则保留原图。</small>
              </label>
              <div class="image-preview" id="imagePreview" aria-live="polite">
                <span>未选择图片</span>
              </div>
            </div>

            <div class="editor-actions">
              <button class="primary-button" id="submitEntryButton" type="submit">发布日记</button>
              <button class="secondary-button" id="cancelEditButton" type="button" hidden>取消编辑</button>
              <button class="text-button" id="resetButton" type="button">清空</button>
            </div>
          </form>
        </section>

        <section class="entries-section" id="entries" aria-labelledby="entriesTitle">
          <div class="section-heading">
            <p class="eyebrow">Archive</p>
            <h2 id="entriesTitle">日记归档</h2>
          </div>
          <div class="toolbar">
            <input id="searchInput" type="search" placeholder="搜索标题、正文或心情" />
            <select id="sortInput" aria-label="排序方式">
              <option value="newest">最新优先</option>
              <option value="oldest">最早优先</option>
              <option value="title">标题排序</option>
            </select>
          </div>
          <div class="entries-grid" id="entriesGrid"></div>
          <p class="empty-state" id="emptyState">还没有公开日记。</p>
        </section>
      </main>
    </div>

    <template id="entryTemplate">
      <article class="entry-card">
        <div class="entry-image"></div>
        <div class="entry-body">
          <div class="entry-meta">
            <span class="entry-date"></span>
            <span class="entry-mood"></span>
          </div>
          <h3></h3>
          <p></p>
          <div class="entry-actions">
            <span class="entry-visibility"></span>
            <div class="entry-tools">
              <button class="text-button edit-entry" type="button">编辑</button>
              <button class="text-button delete-entry" type="button">删除</button>
            </div>
          </div>
        </div>
      </article>
    </template>

    <div class="auth-modal" id="authModal" hidden>
      <div class="auth-backdrop" id="authBackdrop"></div>
      <section class="auth-dialog" role="dialog" aria-modal="true" aria-labelledby="authTitle">
        <button class="modal-close" id="closeAuthButton" type="button" aria-label="关闭登录框">×</button>
        <p class="eyebrow">Account</p>
        <h2 id="authTitle">登录后台</h2>
        <p class="auth-hint">管理员登录后可以发布、编辑和设置日记权限。</p>

        <div class="auth-tabs" role="tablist" aria-label="登录方式">
          <button class="auth-tab active" data-auth-tab="password" type="button">账号密码</button>
          <button class="auth-tab" data-auth-tab="phone" type="button">手机验证码</button>
        </div>

        <form class="auth-form active" id="passwordAuthForm" data-auth-panel="password">
          <label>
            邮箱
            <input id="loginEmailInput" type="email" placeholder="you@example.com" autocomplete="email" />
          </label>
          <label>
            密码
            <input id="loginPasswordInput" type="password" placeholder="请输入密码" autocomplete="current-password" />
          </label>
          <div class="auth-actions">
            <button class="primary-button" id="passwordLoginButton" type="submit">登录</button>
            <button class="secondary-button" id="passwordSignupButton" type="button">注册账号</button>
          </div>
        </form>

        <form class="auth-form" id="phoneAuthForm" data-auth-panel="phone">
          <label>
            手机号
            <input id="phoneInput" type="tel" placeholder="+8613812345678" autocomplete="tel" />
          </label>
          <label>
            验证码
            <input id="phoneCodeInput" type="text" inputmode="numeric" placeholder="短信验证码" />
          </label>
          <div class="auth-actions">
            <button class="secondary-button" id="sendPhoneCodeButton" type="button">发送验证码</button>
            <button class="primary-button" type="submit">验证登录</button>
          </div>
        </form>
      </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
